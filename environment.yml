name: local_imagent_J
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - openjdk=21
  - maven
  - pip
  # ImageJ/Java bridge
  - pyimagej=1.7.0
  - jpype1=1.6.0
  - scyjava=1.12.1
  - imglyb=2.1.0
  - jgo=1.0.6
  # GUI
  - pyside6
  # Data science
  - numpy
  - pandas
  - scipy
  - seaborn
  - matplotlib
  - matplotlib-base
  # Grammar-of-graphics plotting (ggplot2-style) — the 'plotnine' skill. statsmodels
  # backs geom_smooth(method="lm"/"lowess"); scikit-misc backs method="loess".
  - plotnine
  - statsmodels
  - scikit-misc
  - xarray
  - tifffile
  # Image analysis / ML (python_coder agent)
  - scikit-image
  - scikit-learn
  # LangChain / LangGraph
  - langchain
  - langgraph
  - langgraph-checkpoint
  - langgraph-prebuilt
  - langgraph-sdk
  - langsmith
  # Utilities
  - pyyaml
  - requests
  - httpx
  - ipython
  - ipykernel
  - sqlalchemy
  - pydantic
  - jsonschema
  - psutil
  - nest-asyncio
  - aiohttp
  - pip:
      # docling + its OCR/layout/table models (docling-core, docling-ibm-models,
      # docling-parse, rapidocr, langchain-docling) are DELIBERATELY not installed
      # here. They exist only to support the offline RAG-ingestion pipeline
      # (rag/loaders.py, invoked by rag/RAG.py's ingest_documents()/
      # load_folder_recursively(), run by a maintainer to build/update
      # qdrant_data/) — the live rag_retrieve_docs tool never touches them, it
      # only queries the already-built Qdrant collection. Installing docling
      # transitively pulls torch+transformers+triton+nvidia-* (~4.7 GB, and as
      # a CUDA build even on the CPU image, since nothing here pins a CPU wheel
      # index for it) into every shipped container for a maintainer-only,
      # occasional operation. Run ingestion from a separate local environment
      # that has docling installed instead (see rag/loaders.py's module
      # docstring). pymupdf/pymupdf4llm stay below — file_tools.py's PDF
      # reader uses them directly and they carry no torch dependency.
      #- accelerate
      - aiofiles
      - aiohttp-retry
      - anthropic
      - antlr4-python3-runtime
      - beautifulsoup4
      - click
      - colorlog
      # CellProfiler's measurement engine as a library. MUST come from GitHub —
      # the PyPI 'cp-measure' exposes the older featurize() API. Builds mahotas
      # from sdist (no cp313 wheel exists) and downgrades pillow to <12 via
      # centrosome; both verified harmless for pyimagej/matplotlib/seaborn.
      - cp_measure @ git+https://github.com/afermg/cp_measure.git
      - dataclasses-json
      - daytona
      - ddgs
      - deepagents
      - deprecated
      - dill
      - distro
      - docstring-parser
      - environs
      - et-xmlfile
      - fake-useragent
      - fastembed
      - faker
      - filelock
      - filetype
      - fsspec
      - git-filter-repo
      - gitpython
      - grpcio
      - h2
      - httpx-sse
      - huggingface-hub
      - jinja2
      - jiter
      - jsonlines
      - jsonref
      - langchain-anthropic
      - langchain-classic
      - langchain-community
      - langchain-core
      - langchain-openai
      - langchain-pymupdf4llm
      - langchain-qdrant
      - langchain-text-splitters
      - langgraph-checkpoint-sqlite
      - lark
      - latex2mathml
      - lxml
      - markdown-it-py
      - marko
