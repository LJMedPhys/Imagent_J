# Temporary benchmark override for a local LLM server bound to host loopback.
services:
  imagentj:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      - LOCAL_LLM_BASE_URL=http://0.0.0.0:18000/v1
      - LOCAL_LLM_API_KEY=EMPTY
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-GLM-5.3-Flash}
      - LOCAL_LLM_API=responses
      - NOVNC_PORT=6081
