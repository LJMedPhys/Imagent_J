[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagentj"
version = "0.2.0"
description = "AI-powered agent for ImageJ/Fiji scripting and bioimage analysis."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "ISAS e.V.", email = "agentj.help@gmail.com" },
]
keywords = ["imagej", "fiji", "bioimage", "agent", "llm"]
# Runtime dependencies are managed as uv lock files in docker/requirements/
# (main.txt for this package's own env). This block stays empty so that
# `pip install .` does not try to resolve them on its own.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[tool.setuptools.packages.find]
where = ["src"]
