# GPU override for amd64 hosts with an NVIDIA GPU.
#
# Requirements:
#   • NVIDIA driver 520+ (for CUDA 12.4) installed on the host
#   • nvidia-container-toolkit installed and configured
#     (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html)
#
# Build the GPU image:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build
#
# Run:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# To target a different CUDA version set CUDA_TAG in your environment before building:
#   CUDA_TAG=cu126 docker compose -f docker-compose.yml -f docker-compose.gpu.yml build
#   Driver requirements: cu118 → 520+, cu121 → 530+, cu124 → 550+, cu126 → 560+
#   tensorflow[and-cuda]==2.15.1 bundles CUDA 12.2 (driver 535+), so effective
#   minimum with the default cu121 tag is driver 535.

services:
  imagentj:
    image: ${IMAGENTJ_IMAGE:-agenticj:gpu-local}
    build:
      args:
        USE_GPU: "true"
        CUDA_TAG: ${CUDA_TAG:-cu124}
    environment:
      # Expose all NVIDIA GPUs to the container runtime
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
